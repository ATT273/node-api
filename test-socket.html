<!doctype html>
<html>
  <head>
    <title>Socket.IO Test</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Socket.IO Connection Test</h1>
    <div id="status">Connecting...</div>

    <script>
      const socket = io("http://localhost:5000");

      socket.on("connect", () => {
        document.getElementById("status").innerHTML = "✅ Connected! Socket ID: " + socket.id;
        console.log("✅ Connected from client:", socket.id);
      });

      socket.on("disconnect", () => {
        document.getElementById("status").innerHTML = "❌ Disconnected";
        console.log("❌ Disconnected from server");
      });

      socket.on("connect_error", (error) => {
        document.getElementById("status").innerHTML = "❌ Connection Error: " + error.message;
        console.log("❌ Error:", error);
      });

      socket.on("role_updated", (data) => {
        const eventLog = document.getElementById("event-log");
        const eventItem = document.createElement("div");
        eventItem.style.padding = "5px";
        eventItem.style.borderBottom = "1px solid #ccc";
        eventItem.innerHTML = `
        <strong>Role Updated!</strong><br>
        Role ID: ${data.roleId}<br>
        Message: ${data.message}<br>
        Time: ${new Date().toLocaleTimeString()}
      `;
        eventLog.prepend(eventItem);
      });
    </script>
  </body>
</html>
